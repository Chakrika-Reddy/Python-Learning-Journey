<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileGuard — File Versioning &amp; Recovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --sidebar-bg:#161D2B;
    --sidebar-bg-hover:#1F2A3D;
    --sidebar-text:#8D97AC;
    --sidebar-text-active:#FFFFFF;
    --bg:#F2F3F6;
    --surface:#FFFFFF;
    --border:#E3E5EA;
    --ink:#171B26;
    --ink-soft:#6B7280;
    --ink-faint:#9AA1AE;
    --accent:#3E6B8A;
    --accent-deep:#2E5268;
    --accent-tint:#E7EEF2;
    --success:#2E8B57;
    --success-tint:#E5F3EC;
    --danger:#C24B3D;
    --danger-tint:#FBEAE7;
    --warn-tint:#FBF3E7;
    --radius:8px;
    --shadow:0 1px 2px rgba(23,27,38,.06), 0 2px 8px rgba(23,27,38,.04);
  }
  *{box-sizing:border-box;}
  html,body,#root{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif; font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  button{ font-family:'Inter', sans-serif; cursor:pointer; }
  input, select, textarea{ font-family:'Inter', sans-serif; }
  ::selection{ background:var(--accent); color:#fff; }

  /* ---------------- Layout ---------------- */
  .shell{ display:grid; grid-template-columns:236px 1fr; height:100vh; }

  .sidebar{
    background:var(--sidebar-bg); color:var(--sidebar-text);
    display:flex; flex-direction:column; padding:20px 14px;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 22px; }
  .sidebar-brand .logo{
    width:30px; height:30px; border-radius:7px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; flex-shrink:0;
  }
  .sidebar-brand .name{ color:#fff; font-weight:700; font-size:15px; line-height:1.2; }
  .sidebar-brand .sub{ color:var(--sidebar-text); font-size:10.5px; line-height:1.2; }

  .nav-group{ display:flex; flex-direction:column; gap:2px; margin-bottom:6px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px;
    color:var(--sidebar-text); font-size:13.5px; font-weight:500; border:none; background:transparent;
    text-align:left; width:100%; transition:background .12s ease, color .12s ease;
  }
  .nav-item .icon{ width:18px; text-align:center; flex-shrink:0; font-size:14px; }
  .nav-item:hover{ background:var(--sidebar-bg-hover); color:#fff; }
  .nav-item.active{ background:var(--accent); color:#fff; }

  .sidebar-footer{
    border-top:1px solid rgba(255,255,255,.08); padding-top:14px; margin-top:10px;
  }
  .monitor-pill{
    display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:7px;
    background:var(--sidebar-bg-hover); font-size:12.5px; color:#C9D0DD;
  }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.on{ background:#3FC57A; box-shadow:0 0 0 3px rgba(63,197,122,.18); }
  .dot.off{ background:#828A99; }

  .content{ overflow-y:auto; padding:28px 36px 60px; }
  .page-header{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
  .page-header h1{ font-size:21px; font-weight:700; margin:0 0 4px; }
  .page-header .desc{ color:var(--ink-soft); font-size:13px; }
  .back-link{
    background:none; border:none; color:var(--ink-soft); font-size:12.5px; font-weight:600;
    display:flex; align-items:center; gap:6px; padding:0 0 10px; cursor:pointer;
  }
  .back-link:hover{ color:var(--ink); }

  /* ---------------- Buttons ---------------- */
  .btn{
    border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    padding:9px 16px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:8px;
    transition:background .12s ease, border-color .12s ease, transform .05s ease;
  }
  .btn:hover{ background:#F7F8FA; border-color:#D2D5DB; }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:var(--accent); border-color:var(--accent-deep); color:#fff; }
  .btn.primary:hover{ background:var(--accent-deep); }
  .btn.danger{ background:var(--danger); border-color:#A53D31; color:#fff; }
  .btn.danger:hover{ background:#A53D31; }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--accent); padding:9px 10px; }
  .btn.ghost:hover{ background:var(--accent-tint); }
  .btn.small{ padding:6px 11px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn:disabled:hover{ background:var(--surface); border-color:var(--border); }

  /* ---------------- Cards / Surfaces ---------------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad{ padding:20px; }
  .section-title{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700; margin-bottom:12px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
  .stat-card{ padding:16px 18px; }
  .stat-card .label{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:8px; }
  .stat-card .value{ font-size:22px; font-weight:700; }
  .stat-card .value.success{ color:var(--success); }
  .stat-card .foot{ font-size:11.5px; color:var(--ink-faint); margin-top:4px; }

  .hero-actions{ display:flex; gap:12px; margin-bottom:26px; flex-wrap:wrap; }
  .hero-actions .btn{ padding:13px 22px; font-size:13.5px; }

  .list-block{ margin-bottom:24px; }
  .list-block-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .list-block-head h3{ font-size:14.5px; font-weight:700; margin:0; }
  .link-more{ background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; }

  .file-row{
    display:flex; align-items:center; gap:14px; padding:13px 16px; border-bottom:1px solid var(--border);
    cursor:pointer; transition:background .1s ease;
  }
  .file-row:last-child{ border-bottom:none; }
  .file-row:hover{ background:#FAFBFC; }
  .file-row .fico{ width:34px; height:34px; border-radius:7px; background:var(--accent-tint); color:var(--accent-deep);
    display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .file-row .finfo{ flex:1; min-width:0; }
  .file-row .fname{ font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .file-row .fpath{ font-size:11.5px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .file-row .fmeta{ text-align:right; flex-shrink:0; }
  .file-row .fver{ font-size:12.5px; font-weight:700; color:var(--accent-deep); }
  .file-row .ftime{ font-size:11px; color:var(--ink-faint); }

  .folder-chip-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .folder-chip{
    display:flex; align-items:center; gap:8px; padding:9px 14px; border:1px solid var(--border);
    border-radius:7px; background:var(--surface); font-size:12.5px; font-weight:500;
  }
  .folder-chip .count{ color:var(--ink-faint); font-size:11px; }
  .folder-chip .rm{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px; padding:0 0 0 4px; }
  .folder-chip .rm:hover{ color:var(--danger); }

  .activity-item{ display:flex; gap:12px; padding:11px 16px; border-bottom:1px solid var(--border); align-items:flex-start; }
  .activity-item:last-child{ border-bottom:none; }
  .activity-item .aic{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; flex-shrink:0; margin-top:1px; }
  .activity-item .aic.success{ background:var(--success-tint); color:var(--success); }
  .activity-item .aic.neutral{ background:var(--accent-tint); color:var(--accent-deep); }
  .activity-item .atext{ font-size:13px; }
  .activity-item .atext b{ font-weight:600; }
  .activity-item .atime{ font-size:11px; color:var(--ink-faint); margin-top:2px; }

  /* ---------------- File Details ---------------- */
  .file-title-row{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .file-title-row .fico-lg{ width:44px; height:44px; border-radius:9px; background:var(--accent-tint); color:var(--accent-deep);
    display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; }
  .file-title-row h2{ font-size:19px; font-weight:700; margin:0; }
  .file-path{ font-size:12px; color:var(--ink-faint); margin:2px 0 18px 58px; }

  .fd-stats{ display:flex; gap:28px; margin:0 0 20px 58px; flex-wrap:wrap; }
  .fd-stat .l{ font-size:11.5px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .fd-stat .v{ font-size:15px; font-weight:700; margin-top:2px; }

  .fd-actions{ display:flex; gap:10px; margin:0 0 24px 58px; flex-wrap:wrap; }

  .external-session{
    margin:0 0 24px 58px; padding:14px 16px; border:1px solid var(--accent); background:var(--accent-tint);
    border-radius:var(--radius); display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .external-session .txt{ font-size:13px; color:var(--accent-deep); }
  .external-session .txt b{ font-weight:700; }

  .version-list{ list-style:none; margin:0; padding:0; }
  .version-row{
    display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--border);
  }
  .version-row:last-child{ border-bottom:none; }
  .version-row .vbadge{
    width:40px; height:40px; border-radius:8px; background:var(--bg); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; color:var(--ink-soft);
    flex-shrink:0;
  }
  .version-row.current .vbadge{ background:var(--accent); border-color:var(--accent-deep); color:#fff; }
  .version-row .vinfo{ flex:1; min-width:0; }
  .version-row .vtop{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .version-row .vtime{ font-weight:600; font-size:13px; }
  .version-row .vsize{ font-size:11.5px; color:var(--ink-faint); }
  .version-row .vtag{
    font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:var(--success);
    background:var(--success-tint); padding:2px 7px; border-radius:4px;
  }
  .version-row .vnote{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .version-row .vactions{ display:flex; gap:6px; flex-shrink:0; }

  /* ---------------- Compare ---------------- */
  .compare-head{ display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:22px; flex-wrap:wrap; }
  .compare-side{ text-align:center; }
  .compare-side .cv{ font-size:20px; font-weight:800; }
  .compare-side .ct{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .compare-vs{ width:34px; height:34px; border-radius:50%; background:var(--bg); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--ink-faint); }

  .diff-grid{ display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .diff-pane{ padding:14px; font-family:'IBM Plex Mono', monospace; font-size:12.5px; background:var(--surface); }
  .diff-pane + .diff-pane{ border-left:1px solid var(--border); }
  .diff-pane .dl{ padding:2px 8px; white-space:pre-wrap; word-break:break-word; border-radius:3px; }
  .diff-pane .dl.added{ background:var(--success-tint); color:#1E6B41; }
  .diff-pane .dl.removed{ background:var(--danger-tint); color:#9C3B2F; text-decoration:line-through; text-decoration-thickness:1px; }
  .diff-pane .dl.same{ color:var(--ink-faint); }

  .meta-compare-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-bottom:20px; }
  .meta-compare-grid .card-pad .row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .meta-compare-grid .card-pad .row:last-child{ border-bottom:none; }
  .meta-compare-grid .card-pad .row span:first-child{ color:var(--ink-soft); }
  .meta-compare-grid .card-pad .row span:last-child{ font-weight:600; }

  /* ---------------- Settings ---------------- */
  .settings-section{ margin-bottom:26px; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); gap:16px; flex-wrap:wrap; }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row .lab{ font-size:13.5px; font-weight:600; }
  .settings-row .hint{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .toggle{ width:42px; height:24px; border-radius:99px; background:var(--border); position:relative; border:none; cursor:pointer; flex-shrink:0; transition:background .15s ease; }
  .toggle.on{ background:var(--success); }
  .toggle .knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s ease; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .toggle.on .knob{ left:20px; }
  .num-input{ width:64px; padding:7px 9px; border:1px solid var(--border); border-radius:6px; text-align:center; font-size:13px; }
  .checkbox-row{ display:flex; align-items:center; gap:9px; }
  .path-tag{ font-family:'IBM Plex Mono', monospace; font-size:12px; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:6px 10px; color:var(--ink-soft); }

  /* ---------------- Modals ---------------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,19,28,.55); display:flex; align-items:center; justify-content:center; z-index:80; padding:20px; }
  .modal{ background:var(--surface); border-radius:10px; width:min(460px,100%); padding:22px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .modal.wide{ width:min(560px,100%); }
  .modal h3{ font-size:16.5px; font-weight:700; margin:0 0 6px; }
  .modal .modal-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:7px; font-size:13px; }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .warn-box{ background:var(--warn-tint); border:1px solid #E6D4A8; border-radius:7px; padding:10px 12px; font-size:12.5px; color:#8A6A1D; margin-bottom:16px; }
  .picker-list{ max-height:260px; overflow-y:auto; border:1px solid var(--border); border-radius:7px; margin-bottom:14px; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-faint); }
  .empty-state .glyph{ font-size:30px; margin-bottom:10px; }
  .empty-state .msg{ font-size:13.5px; }

  .toast-stack{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:100; }
  .toast{
    background:var(--ink); color:#fff; padding:11px 16px; border-radius:8px; font-size:12.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.25); display:flex; align-items:center; gap:9px; min-width:220px;
    animation:toastIn .18s ease;
  }
  .toast.success{ border-left:3px solid #3FC57A; }
  .toast.info{ border-left:3px solid var(--accent); }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  @media (max-width:860px){
    .shell{ grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    .sidebar{ flex-direction:row; overflow-x:auto; align-items:center; padding:12px; }
    .nav-group{ flex-direction:row; flex:none; }
    .sidebar-brand,.sidebar-footer{ display:none; }
    .diff-grid{ grid-template-columns:1fr; }
    .diff-pane + .diff-pane{ border-left:none; border-top:1px solid var(--border); }
    .meta-compare-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useCallback, useEffect, useRef } = React;

/* ================= Mock data generation ================= */
function pad(n){ return String(n).padStart(2,'0'); }
function fmtTime(d){
  let h = d.getHours(), ampm = h>=12 ? 'PM':'AM';
  h = h % 12; if(h===0) h = 12;
  return `${pad(h)}:${pad(d.getMinutes())} ${ampm}`;
}
function fmtDay(d, refNow){
  const oneDay = 86400000;
  const dOnly = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const nOnly = new Date(refNow.getFullYear(), refNow.getMonth(), refNow.getDate());
  const diff = Math.round((nOnly - dOnly) / oneDay);
  if(diff === 0) return 'Today';
  if(diff === 1) return 'Yesterday';
  return `${d.toLocaleString('en-US',{month:'short'})} ${d.getDate()}`;
}
function fmtFull(d){
  return `${d.toLocaleString('en-US',{month:'long'})} ${d.getDate()}, ${d.getFullYear()} — ${fmtTime(d)}`;
}
function fmtShort(d, refNow){ return `${fmtDay(d, refNow)}, ${fmtTime(d)}`; }

const NOW = new Date();

const FILE_TYPES = {
  docx: { label:'Document', icon:'📄', diffable:true },
  txt:  { label:'Text', icon:'📝', diffable:true },
  md:   { label:'Text', icon:'📝', diffable:true },
  pdf:  { label:'PDF', icon:'📕', diffable:false },
  pptx: { label:'Presentation', icon:'📊', diffable:false },
  xlsx: { label:'Spreadsheet', icon:'📈', diffable:false },
};
function extOf(name){ const p = name.split('.'); return p.length>1 ? p[p.length-1].toLowerCase() : 'txt'; }
function typeOf(name){ return FILE_TYPES[extOf(name)] || FILE_TYPES.txt; }

let idCounter = 1;
function nextId(prefix){ return `${prefix}_${idCounter++}`; }

function buildVersions(fileName, count, baseSize, minutesApart, baseContentLines){
  const versions = [];
  const diffable = typeOf(fileName).diffable;
  let lines = [...baseContentLines];
  for(let i=1;i<=count;i++){
    const t = new Date(NOW.getTime() - (count - i) * minutesApart * 60000);
    if(diffable && i>1){ lines = [...lines, `Edit pass ${i-1}: revised section and added notes.`]; }
    versions.push({
      v:i,
      timestamp: t,
      size: `${(baseSize + i*0.15).toFixed(1)} MB`,
      content: diffable ? lines.join('\n') : null,
      restoredFrom: null,
    });
  }
  return versions;
}

function makeInitialFiles(){
  return [
    {
      id: nextId('file'),
      name:'Project_Report.docx',
      path:'C:\\Users\\Neeharika\\Documents\\College Projects\\Project_Report.docx',
      folder:'College Projects',
      versions: buildVersions('Project_Report.docx', 7, 1.6, 22, [
        'Project Report — Introduction',
        'Covers scope, objectives, and methodology.'
      ]),
    },
    {
      id: nextId('file'),
      name:'Assignment.pdf',
      path:'C:\\Users\\Neeharika\\Documents\\Assignments\\Assignment.pdf',
      folder:'Assignments',
      versions: buildVersions('Assignment.pdf', 3, 0.9, 40, []),
    },
    {
      id: nextId('file'),
      name:'Presentation.pptx',
      path:'C:\\Users\\Neeharika\\Documents\\College Projects\\Presentation.pptx',
      folder:'College Projects',
      versions: buildVersions('Presentation.pptx', 12, 3.4, 15, []),
    },
  ];
}

function makeInitialFolders(){
  return [
    { id: nextId('folder'), name:'College Projects', path:'C:\\Users\\Neeharika\\Documents\\College Projects' },
    { id: nextId('folder'), name:'Documents', path:'C:\\Users\\Neeharika\\Documents' },
    { id: nextId('folder'), name:'Assignments', path:'C:\\Users\\Neeharika\\Documents\\Assignments' },
  ];
}

/* ================= Diff helper (line-based LCS) ================= */
function diffLines(a, b){
  const la = (a||'').split('\n'), lb = (b||'').split('\n');
  const n = la.length, m = lb.length;
  const dp = Array.from({length:n+1}, ()=> new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j] = la[i]===lb[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const left=[], right=[]; let i=0,j=0;
  while(i<n && j<m){
    if(la[i]===lb[j]){ left.push({t:'same',x:la[i]}); right.push({t:'same',x:lb[j]}); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ left.push({t:'removed',x:la[i]}); i++; }
    else { right.push({t:'added',x:lb[j]}); j++; }
  }
  while(i<n){ left.push({t:'removed',x:la[i]}); i++; }
  while(j<m){ right.push({t:'added',x:lb[j]}); j++; }
  return { left, right };
}

/* ================= App ================= */
function App(){
  const [files, setFiles] = useState(makeInitialFiles);
  const [folders, setFolders] = useState(makeInitialFolders);
  const [activity, setActivity] = useState(() => {
    const initial = [];
    initial.push({ id: nextId('act'), kind:'success', text:<>New version created — <b>Project_Report.docx</b> V7</>, time: new Date(NOW.getTime()-3*60000) });
    initial.push({ id: nextId('act'), kind:'neutral', text:<>File modified — <b>Assignment.pdf</b></>, time: new Date(NOW.getTime()-70*60000) });
    initial.push({ id: nextId('act'), kind:'success', text:<>New version created — <b>Presentation.pptx</b> V12</>, time: new Date(NOW.getTime()-15*60000) });
    return initial.sort((a,b)=> b.time - a.time);
  });
  const [monitoring, setMonitoring] = useState(true);
  const [maxVersions, setMaxVersions] = useState(10);
  const [autoRemove, setAutoRemove] = useState(true);
  const [storageLocation, setStorageLocation] = useState('C:\\FileVersioning\\Versions');

  const [page, setPage] = useState('home'); // home | files | activity | folders | settings | fileDetails | versionDetails | compare
  const [selectedFileId, setSelectedFileId] = useState(null);
  const [selectedVersionNum, setSelectedVersionNum] = useState(null);
  const [compareVersions, setCompareVersions] = useState([]); // [vA, vB]
  const [openSession, setOpenSession] = useState({}); // fileId -> true when "opened externally"

  const [modal, setModal] = useState(null); // 'openFile' | 'createFile' | 'addFolder' | {type:'restore', fileId, v}
  const [toasts, setToasts] = useState([]);

  function pushToast(text, kind='info'){
    const id = nextId('toast');
    setToasts(t => [...t, {id, text, kind}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 3200);
  }
  function logActivity(kind, node){
    setActivity(a => [{ id: nextId('act'), kind, text: node, time: new Date() }, ...a].slice(0, 60));
  }

  function goHome(){ setPage('home'); setSelectedFileId(null); setSelectedVersionNum(null); setCompareVersions([]); }
  function openFileDetails(fileId){ setSelectedFileId(fileId); setSelectedVersionNum(null); setCompareVersions([]); setPage('fileDetails'); }

  const activeFile = useMemo(()=> files.find(f=>f.id===selectedFileId) || null, [files, selectedFileId]);

  function enforceLimit(file){
    if(!autoRemove) return file.versions;
    let versions = file.versions;
    while(versions.length > maxVersions){
      versions = versions.slice(1);
    }
    return versions;
  }

  function addVersion(fileId, {content, restoredFrom, sizeBump}={}){
    setFiles(prev => prev.map(f => {
      if(f.id !== fileId) return f;
      const last = f.versions[f.versions.length-1];
      const newV = {
        v: last.v + 1,
        timestamp: new Date(),
        size: f.versions[0].content === null && content === null
          ? `${(parseFloat(last.size) + (sizeBump||0.1)).toFixed(1)} MB`
          : `${(parseFloat(last.size) + (sizeBump||0.1)).toFixed(1)} MB`,
        content: content !== undefined ? content : last.content,
        restoredFrom: restoredFrom || null,
      };
      let versions = [...f.versions, newV];
      if(autoRemove){
        while(versions.length > maxVersions) versions = versions.slice(1);
      }
      return { ...f, versions };
    }));
  }

  function handleCreateVersionManually(file){
    const last = file.versions[file.versions.length-1];
    const newContent = last.content !== null ? last.content + `\nManual edit recorded at ${fmtTime(new Date())}.` : null;
    addVersion(file.id, { content: newContent });
    pushToast(`Version ${last.v+1} created for ${file.name}`, 'success');
    logActivity('success', <>New version created — <b>{file.name}</b> V{last.v+1}</>);
  }

  function handleSimulateExternalSave(file){
    const last = file.versions[file.versions.length-1];
    const newContent = last.content !== null ? last.content + `\nAuto-detected edit at ${fmtTime(new Date())}.` : null;
    addVersion(file.id, { content: newContent });
    pushToast(`Background monitor detected a change — Version ${last.v+1} created`, 'success');
    logActivity('success', <>New version created — <b>{file.name}</b> V{last.v+1}</>);
  }

  function handleRestore(file, versionNum){
    const target = file.versions.find(v=>v.v===versionNum);
    const last = file.versions[file.versions.length-1];
    addVersion(file.id, { content: target.content, restoredFrom: `Restored copy of V${versionNum}`, sizeBump: 0.05 });
    pushToast(`Version ${versionNum} restored successfully — new version V${last.v+1} created`, 'success');
    logActivity('success', <>Version {versionNum} restored — <b>{file.name}</b> V{last.v+1} created</>);
    setModal(null);
  }

  function handleCreateFile({name, folder, type}){
    const id = nextId('file');
    const diffable = typeOf(name).diffable;
    const f = {
      id, name,
      path: `C:\\Users\\Neeharika\\Documents\\${folder}\\${name}`,
      folder,
      versions: [{ v:1, timestamp:new Date(), size:'0.1 MB', content: diffable ? 'New file created.' : null, restoredFrom:null }],
    };
    setFiles(prev => [f, ...prev]);
    pushToast(`${name} created — Version 1`, 'success');
    logActivity('success', <>File created — <b>{name}</b> V1</>);
    setModal(null);
    openFileDetails(id);
  }

  function handleAddFolder(name){
    if(!name.trim()) return;
    const f = { id: nextId('folder'), name: name.trim(), path:`C:\\Users\\Neeharika\\Documents\\${name.trim()}` };
    setFolders(prev => [...prev, f]);
    pushToast(`${name.trim()} added to managed folders`, 'success');
    setModal(null);
  }
  function handleRemoveFolder(id){
    setFolders(prev => prev.filter(f=>f.id!==id));
  }

  const sortedFiles = useMemo(()=>
    [...files].sort((a,b)=> b.versions[b.versions.length-1].timestamp - a.versions[a.versions.length-1].timestamp)
  ,[files]);

  const totalVersions = useMemo(()=> files.reduce((s,f)=>s+f.versions.length,0), [files]);

  return (
    <div className="shell">
      <Sidebar page={page} setPage={setPage} monitoring={monitoring} onHome={goHome} />
      <div className="content">
        {page==='home' &&
          <Dashboard
            files={sortedFiles} folders={folders} activity={activity} monitoring={monitoring}
            totalVersions={totalVersions}
            onOpenFile={()=>setModal('openFile')}
            onCreateFile={()=>setModal('createFile')}
            onSelectFile={openFileDetails}
            onSeeAllActivity={()=>setPage('activity')}
          />
        }
        {page==='files' &&
          <MyFiles files={sortedFiles} onSelectFile={openFileDetails} onCreateFile={()=>setModal('createFile')} />
        }
        {page==='activity' &&
          <RecentActivityPage activity={activity} onBack={goHome} />
        }
        {page==='folders' &&
          <ManagedFoldersPage folders={folders} files={files} onAdd={()=>setModal('addFolder')} onRemove={handleRemoveFolder} onBack={goHome} />
        }
        {page==='settings' &&
          <SettingsPage
            monitoring={monitoring} setMonitoring={setMonitoring}
            folders={folders} onAddFolder={()=>setModal('addFolder')} onRemoveFolder={handleRemoveFolder}
            maxVersions={maxVersions} setMaxVersions={setMaxVersions}
            autoRemove={autoRemove} setAutoRemove={setAutoRemove}
            storageLocation={storageLocation} setStorageLocation={setStorageLocation}
            onBack={goHome}
          />
        }
        {page==='fileDetails' && activeFile &&
          <FileDetails
            file={activeFile}
            opened={!!openSession[activeFile.id]}
            onBack={goHome}
            onOpenExternal={()=>{ setOpenSession(s=>({...s,[activeFile.id]:true})); pushToast(`${activeFile.name} opened in default application`, 'info'); }}
            onSimulateSave={()=>handleSimulateExternalSave(activeFile)}
            onCreateVersion={()=>handleCreateVersionManually(activeFile)}
            onViewVersion={(v)=>{ setSelectedVersionNum(v); setPage('versionDetails'); }}
            onCompareRequest={(a,b)=>{ setCompareVersions([a,b]); setPage('compare'); }}
            onRestoreRequest={(v)=> setModal({type:'restore', fileId:activeFile.id, v}) }
          />
        }
        {page==='versionDetails' && activeFile && selectedVersionNum!==null &&
          <VersionDetails
            file={activeFile} versionNum={selectedVersionNum}
            onBack={()=>setPage('fileDetails')}
            onCompareWithCurrent={()=>{ const last = activeFile.versions[activeFile.versions.length-1].v; setCompareVersions([selectedVersionNum, last]); setPage('compare'); }}
            onRestoreRequest={()=> setModal({type:'restore', fileId:activeFile.id, v:selectedVersionNum}) }
          />
        }
        {page==='compare' && activeFile && compareVersions.length===2 &&
          <CompareVersions
            file={activeFile} vA={compareVersions[0]} vB={compareVersions[1]}
            onBack={()=>setPage('fileDetails')}
          />
        }
      </div>

      {modal==='openFile' &&
        <OpenFilePickerModal files={sortedFiles} onClose={()=>setModal(null)}
          onPick={(id)=>{ setModal(null); openFileDetails(id); }} />
      }
      {modal==='createFile' &&
        <CreateFileModal folders={folders} onClose={()=>setModal(null)} onCreate={handleCreateFile} />
      }
      {modal==='addFolder' &&
        <AddFolderModal onClose={()=>setModal(null)} onAdd={handleAddFolder} />
      }
      {modal && modal.type==='restore' &&
        <RestoreConfirmModal
          version={modal.v}
          onClose={()=>setModal(null)}
          onConfirm={()=>{ const f = files.find(x=>x.id===modal.fileId); handleRestore(f, modal.v); }}
        />
      }

      <Toasts toasts={toasts} />
    </div>
  );
}

/* ================= File Details ================= */
function FileDetails({file, opened, onBack, onOpenExternal, onSimulateSave, onCreateVersion, onViewVersion, onCompareRequest, onRestoreRequest}){
  const [checked, setChecked] = useState([]);
  const t = typeOf(file.name);
  const last = file.versions[file.versions.length-1];
  const reversed = [...file.versions].reverse();

  function toggleCheck(v){
    setChecked(c => {
      if(c.includes(v)) return c.filter(x=>x!==v);
      const nc = [...c, v];
      return nc.length>2 ? nc.slice(1) : nc;
    });
  }

  return (
    <div>
      <button className="back-link" onClick={onBack}>← Home</button>

      <div className="file-title-row">
        <div className="fico-lg">{t.icon}</div>
        <h2>{file.name}</h2>
      </div>
      <div className="file-path mono">{file.path}</div>

      <div className="fd-stats">
        <div className="fd-stat"><div className="l">Current Version</div><div className="v">V{last.v}</div></div>
        <div className="fd-stat"><div className="l">Last Modified</div><div className="v">{fmtShort(last.timestamp, NOW)}</div></div>
        <div className="fd-stat"><div className="l">File Size</div><div className="v">{last.size}</div></div>
      </div>

      <div className="fd-actions">
        <button className="btn primary" onClick={onOpenExternal}><Icon>📂</Icon>Open File</button>
        <button className="btn" onClick={onCreateVersion}><Icon>＋</Icon>Create Version</button>
        <button className="btn" disabled={checked.length!==2} onClick={()=>onCompareRequest(...([...checked].sort((a,b)=>a-b)))}>
          Compare Selected
        </button>
      </div>

      {opened &&
        <div className="external-session">
          <div className="txt"><b>{file.name}</b> is open in its default application. Edit and save normally — FileGuard will pick up the change.</div>
          <button className="btn small primary" onClick={onSimulateSave}>Simulate Save (trigger version)</button>
        </div>
      }

      <div className="section-title">Version History</div>
      <div className="card">
        <ul className="version-list">
          {reversed.map((ver, idx) => {
            const isCurrent = idx===0;
            return (
              <li key={ver.v} className={`version-row ${isCurrent?'current':''}`}>
                <input type="checkbox" checked={checked.includes(ver.v)} onChange={()=>toggleCheck(ver.v)} style={{marginRight:2}} />
                <div className="vbadge">V{ver.v}</div>
                <div className="vinfo">
                  <div className="vtop">
                    <span className="vtime">{fmtShort(ver.timestamp, NOW)}</span>
                    <span className="vsize mono">{ver.size}</span>
                    {isCurrent && <span className="vtag">Current</span>}
                  </div>
                  {ver.restoredFrom && <div className="vnote">{ver.restoredFrom}</div>}
                </div>
                <div className="vactions">
                  <button className="btn small" onClick={()=>onViewVersion(ver.v)}>View</button>
                  {!isCurrent && <>
                    <button className="btn small" onClick={()=>onCompareRequest(ver.v, last.v)}>Compare</button>
                    <button className="btn small danger" onClick={()=>onRestoreRequest(ver.v)}>Restore</button>
                  </>}
                </div>
              </li>
            );
          })}
        </ul>
      </div>
    </div>
  );
}

/* ================= Version Details ================= */
function VersionDetails({file, versionNum, onBack, onCompareWithCurrent, onRestoreRequest}){
  const ver = file.versions.find(v=>v.v===versionNum);
  const last = file.versions[file.versions.length-1];
  const isCurrent = ver.v === last.v;
  const t = typeOf(file.name);
  return (
    <div>
      <button className="back-link" onClick={onBack}>← Version History</button>
      <div className="page-header"><div><h1>Version {ver.v}</h1><div className="desc">{file.name}</div></div></div>

      <div className="card card-pad" style={{maxWidth:520}}>
        <div style={{display:'flex', flexDirection:'column', gap:14}}>
          <Row label="Created" value={fmtFull(ver.timestamp)} />
          <Row label="File Size" value={ver.size} />
          <Row label="Location" value={<span className="mono" style={{fontSize:12}}>{file.path}</span>} />
          <Row label="Version" value={`${ver.v} of ${last.v}`} />
          {ver.restoredFrom && <Row label="Note" value={ver.restoredFrom} />}
        </div>
      </div>

      <div className="fd-actions" style={{marginLeft:0, marginTop:22}}>
        <button className="btn" onClick={()=>alert(`Opening V${ver.v} of ${file.name} in its default application (read-only preview).`)}>Open This Version</button>
        {!isCurrent && <button className="btn" onClick={onCompareWithCurrent}>Compare With Current</button>}
        {!isCurrent && <button className="btn danger" onClick={()=>onRestoreRequest(ver.v)}>Restore This Version</button>}
      </div>

      {isCurrent && <div style={{marginTop:14, color:'var(--ink-faint)', fontSize:12.5}}>This is the current version of the file.</div>}
    </div>
  );
}
function Row({label, value}){
  return (
    <div style={{display:'flex', justifyContent:'space-between', gap:16}}>
      <span style={{color:'var(--ink-soft)', fontSize:12.5, fontWeight:600}}>{label}</span>
      <span style={{fontWeight:600, fontSize:13, textAlign:'right'}}>{value}</span>
    </div>
  );
}

/* ================= Compare Versions ================= */
function CompareVersions({file, vA, vB, onBack}){
  const a = file.versions.find(v=>v.v===vA);
  const b = file.versions.find(v=>v.v===vB);
  const t = typeOf(file.name);

  return (
    <div>
      <button className="back-link" onClick={onBack}>← File Details</button>
      <div className="page-header"><div><h1>Compare Versions</h1><div className="desc">{file.name}</div></div></div>

      <div className="compare-head">
        <div className="compare-side"><div className="cv">Version {a.v}</div><div className="ct">{fmtShort(a.timestamp, NOW)}</div></div>
        <div className="compare-vs">VS</div>
        <div className="compare-side"><div className="cv">Version {b.v}</div><div className="ct">{fmtShort(b.timestamp, NOW)}</div></div>
      </div>

      {t.diffable
        ? <TextDiff a={a} b={b} />
        : <MetaDiff file={file} a={a} b={b} />
      }
    </div>
  );
}

function TextDiff({a, b}){
  const { left, right } = diffLines(a.content, b.content);
  const renderSide = (arr) => arr.map((l,i) => {
    const prefix = l.t==='added' ? '+ ' : l.t==='removed' ? '- ' : '  ';
    return <div key={i} className={`dl ${l.t}`}>{prefix}{l.x || ' '}</div>;
  });
  return (
    <div className="diff-grid">
      <div className="diff-pane">{renderSide(left)}</div>
      <div className="diff-pane">{renderSide(right)}</div>
    </div>
  );
}

function MetaDiff({file, a, b}){
  return (
    <>
      <div className="meta-compare-grid">
        <div className="card card-pad">
          <div className="section-title">Version {a.v}</div>
          <div className="row"><span>File Size</span><span>{a.size}</span></div>
          <div className="row"><span>Modified</span><span>{fmtShort(a.timestamp, NOW)}</span></div>
          <div className="row"><span>Version</span><span>V{a.v}</span></div>
        </div>
        <div className="card card-pad">
          <div className="section-title">Version {b.v}</div>
          <div className="row"><span>File Size</span><span>{b.size}</span></div>
          <div className="row"><span>Modified</span><span>{fmtShort(b.timestamp, NOW)}</span></div>
          <div className="row"><span>Version</span><span>V{b.v}</span></div>
        </div>
      </div>
      <div className="hint" style={{color:'var(--ink-faint)', fontSize:12.5, marginBottom:16}}>
        Line-by-line comparison isn't available for this file type — showing version metadata instead.
      </div>
      <button className="btn" onClick={()=>alert(`Opening V${a.v} and V${b.v} of ${file.name} side by side in their default application.`)}>Open Both Versions</button>
    </>
  );
}

/* ================= Modals ================= */
function ModalShell({children, wide, onClose}){
  return (
    <div className="modal-backdrop" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className={`modal ${wide?'wide':''}`}>{children}</div>
    </div>
  );
}

function OpenFilePickerModal({files, onClose, onPick}){
  const [customPath, setCustomPath] = useState('');
  return (
    <ModalShell wide onClose={onClose}>
      <h3>Open File</h3>
      <div className="modal-sub">Choose a file from a managed folder, or browse to a new one.</div>
      <div className="picker-list">
        {files.map(f => (
          <div key={f.id} className="file-row" onClick={()=>onPick(f.id)}>
            <div className="fico">{typeOf(f.name).icon}</div>
            <div className="finfo">
              <div className="fname">{f.name}</div>
              <div className="fpath mono">{f.path}</div>
            </div>
          </div>
        ))}
      </div>
      <div className="field">
        <label>Or enter a file path to browse</label>
        <input placeholder="C:\Users\...\SomeFile.docx" value={customPath} onChange={e=>setCustomPath(e.target.value)} />
      </div>
      <div className="modal-actions">
        <button className="btn" onClick={onClose}>Cancel</button>
        <button className="btn primary" disabled={!customPath.trim()} onClick={()=>alert('This would open the OS file picker at: ' + customPath)}>Browse</button>
      </div>
    </ModalShell>
  );
}

function CreateFileModal({folders, onClose, onCreate}){
  const [name, setName] = useState('');
  const [folder, setFolder] = useState(folders[0] ? folders[0].name : '');
  const [type, setType] = useState('docx');

  function submit(){
    if(!name.trim()) return;
    let fname = name.trim();
    if(!fname.includes('.')) fname = `${fname}.${type}`;
    onCreate({ name: fname, folder: folder || 'Documents', type });
  }

  return (
    <ModalShell onClose={onClose}>
      <h3>Create New File</h3>
      <div className="modal-sub">FileGuard will start tracking versions from V1.</div>
      <div className="field">
        <label>File Name</label>
        <input placeholder="Project_Report.docx" value={name} onChange={e=>setName(e.target.value)} />
      </div>
      <div className="field">
        <label>Location</label>
        <select value={folder} onChange={e=>setFolder(e.target.value)}>
          {folders.map(f => <option key={f.id} value={f.name}>{f.name}</option>)}
        </select>
      </div>
      <div className="field">
        <label>File Type</label>
        <select value={type} onChange={e=>setType(e.target.value)}>
          <option value="docx">Document (.docx)</option>
          <option value="txt">Text (.txt)</option>
          <option value="xlsx">Spreadsheet (.xlsx)</option>
          <option value="pptx">Presentation (.pptx)</option>
          <option value="pdf">PDF (.pdf)</option>
        </select>
      </div>
      <div className="modal-actions">
        <button className="btn" onClick={onClose}>Cancel</button>
        <button className="btn primary" disabled={!name.trim()} onClick={submit}>Create File</button>
      </div>
    </ModalShell>
  );
}

function AddFolderModal({onClose, onAdd}){
  const [name, setName] = useState('');
  return (
    <ModalShell onClose={onClose}>
      <h3>Add Managed Folder</h3>
      <div className="modal-sub">FileGuard will watch this folder and version any changes inside it.</div>
      <div className="field">
        <label>Folder Name</label>
        <input placeholder="e.g. Internships" value={name} onChange={e=>setName(e.target.value)} />
      </div>
      <div className="modal-actions">
        <button className="btn" onClick={onClose}>Cancel</button>
        <button className="btn primary" disabled={!name.trim()} onClick={()=>onAdd(name)}>Add Folder</button>
      </div>
    </ModalShell>
  );
}

function RestoreConfirmModal({version, onClose, onConfirm}){
  return (
    <ModalShell onClose={onClose}>
      <h3>Restore Version {version}?</h3>
      <div className="warn-box">
        Your current file will be restored using Version {version}. Your current version will <b>not</b> be permanently deleted — a new version will be added to the history.
      </div>
      <div className="modal-actions">
        <button className="btn" onClick={onClose}>Cancel</button>
        <button className="btn danger" onClick={onConfirm}>Restore Version</button>
      </div>
    </ModalShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
